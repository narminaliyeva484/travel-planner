{% extends "layout.html" %}

{% block title %}
Add Trip
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        ✈️ Plan a New Trip
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">
                Destination
            </label>

            <input 
                type="text" 
                name="destination" 
                class="form-control"
                placeholder="e.g. Tokyo, Japan"
                required>
        </div>


        <div class="mb-3">
            <label class="form-label">
                Start Date
            </label>

            <input 
                type="date" 
                name="date" 
                class="form-control"
                required>
        </div>


        <div class="mb-3">
            <label for="end_date" class="form-label">
                End Date
            </label>

            <input
                type="date"
                class="form-control"
                id="end_date"
                name="end_date"
                required>
        </div>


        <div class="mb-3">
            <label for="budget" class="form-label">Budget</label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="budget"
                id="budget"
                class="form-control"
                placeholder="e.g. 1500"
                required>
        </div>


        <div class="mb-3">
            <label for="currency" class="form-label">Currency</label>

            <select
                name="currency"
                id="currency"
                class="form-select"
                required>

                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="TRY">TRY (₺)</option>
                <option value="JPY">JPY (¥)</option>
                <option value="AZN">AZN (₼)</option>

            </select>
        </div>

        
        <button type="submit" class="button">
            Save Trip
        </button>

    </form>

</div>

{% endblock %}
