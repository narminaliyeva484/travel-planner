{% extends "layout.html" %}

{% block title %}
Add Trip
{% endblock %}

{% block content %}

<h1 class="text-center mb-4">
    ✈️ Plan a New Trip
</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Destination</label>
        <input 
            type="text" 
            name="destination" 
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Date</label>
        <input 
            type="text" 
            name="date" 
            class="form-control"
            required>
    </div>

    <button type="submit" class="btn btn-primary">
        Save Trip
    </button>

</form>

{% endblock %}
