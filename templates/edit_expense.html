{% extends "layout.html" %}

{% block title %}
Edit Expense
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        ✏️ Edit Expense
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label for="amount" class="form-label">
                Amount
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                class="form-control"
                id="amount"
                name="amount"
                value="{{ expense['amount'] }}"
                required>
        </div>


        <div class="mb-3">
            <label for="category" class="form-label">
                Category
            </label>

            <select
                class="form-select"
                id="category"
                name="category"
                required>

                <option value="Flights"
                    {% if expense["category"] == "Flights" %}selected{% endif %}>
                    ✈️ Flights
                </option>

                <option value="Accommodation"
                    {% if expense["category"] == "Accommodation" %}selected{% endif %}>
                    🏨 Accommodation
                </option>

                <option value="Food"
                    {% if expense["category"] == "Food" %}selected{% endif %}>
                    🍔 Food
                </option>

                <option value="Transportation"
                    {% if expense["category"] == "Transportation" %}selected{% endif %}>
                    🚆 Transportation
                </option>

                <option value="Activities"
                    {% if expense["category"] == "Activities" %}selected{% endif %}>
                    🎟️ Activities
                </option>

                <option value="Shopping"
                    {% if expense["category"] == "Shopping" %}selected{% endif %}>
                    🛍️ Shopping
                </option>

                <option value="Health"
                    {% if expense["category"] == "Health" %}selected{% endif %}>
                    💊 Health
                </option>

                <option value="Other"
                    {% if expense["category"] == "Other" %}selected{% endif %}>
                    📦 Other
                </option>

            </select>
        </div>


        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>

            <input
                type="text"
                class="form-control"
                id="description"
                name="description"
                value="{{ expense['description'] or '' }}">
        </div>


        <div class="mb-3">
            <label for="date" class="form-label">
                Date
            </label>

            <input
                type="date"
                class="form-control"
                id="date"
                name="date"
                value="{{ expense['date'] }}"
                required>
        </div>


        <div class="form-actions">

            <button type="submit" class="button">
                💾 Save Changes
            </button>

            <a
                href="{{ url_for('trips_page') }}"
                class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
