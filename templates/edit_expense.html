{% extends "layout.html" %}

{% block title %}
Edit Expense
{% endblock %}

{% block content %}

<div class="container py-5">

```
<h1 class="text-center mb-4">
    ✏️ Edit Expense
</h1>

<form method="POST" class="mx-auto" style="max-width: 600px;">

    <div class="mb-3">
        <label for="amount" class="form-label">
            Amount
        </label>

        <input
            type="number"
            step="0.01"
            min="0"
            class="form-control"
            id="amount"
            name="amount"
            value="{{ expense['amount'] }}"
            required>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">
            Category
        </label>

        <select
            class="form-select"
            id="category"
            name="category"
            required>

            <option value="Flights"
                {% if expense["category"] == "Flights" %}selected{% endif %}>
                ✈️ Flights
            </option>

            <option value="Accommodation"
                {% if expense["category"] == "Accommodation" %}selected{% endif %}>
                🏨 Accommodation
            </option>

            <option value="Food"
                {% if expense["category"] == "Food" %}selected{% endif %}>
                🍔 Food
            </option>

            <option value="Transportation"
                {% if expense["category"] == "Transportation" %}selected{% endif %}>
                🚆 Transportation
            </option>

            <option value="Activities"
                {% if expense["category"] == "Activities" %}selected{% endif %}>
                🎟️ Activities
            </option>

            <option value="Shopping"
                {% if expense["category"] == "Shopping" %}selected{% endif %}>
                🛍️ Shopping
            </option>

            <option value="Health"
                {% if expense["category"] == "Health" %}selected{% endif %}>
                💊 Health
            </option>

            <option value="Other"
                {% if expense["category"] == "Other" %}selected{% endif %}>
                📦 Other
            </option>

        </select>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">
            Description
        </label>

        <input
            type="text"
            class="form-control"
            id="description"
            name="description"
            value="{{ expense['description'] or '' }}">
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">
            Date
        </label>

        <input
            type="date"
            class="form-control"
            id="date"
            name="date"
            value="{{ expense['date'] }}"
            required>
    </div>

    <button type="submit" class="btn btn-primary">
        Save Changes
    </button>

    <a href="{{ url_for('trips_page') }}" class="btn btn-secondary">
        Cancel
    </a>

</form>
```

</div>

{% endblock %}
