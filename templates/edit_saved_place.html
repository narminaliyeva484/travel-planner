{% extends "layout.html" %}

{% block title %}
Edit Place
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        ✏️ Edit Place
    </h1>


    <form method="POST">

        <div class="mb-3">
            <label for="name" class="form-label">
                Place Name
            </label>

            <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                value="{{ place['name'] }}"
                required>
        </div>


        <div class="mb-3">
            <label for="location" class="form-label">
                Location
            </label>

            <input
                type="text"
                class="form-control"
                id="location"
                name="location"
                value="{{ place['location'] }}"
                required>
        </div>


        <div class="mb-3">
            <label for="trip_id" class="form-label">
                Trip
            </label>

            <select
                class="form-select"
                id="trip_id"
                name="trip_id">

                <option value="">
                    No trip yet
                </option>

                {% for trip in trips %}

                    <option
                        value="{{ trip['id'] }}"
                        {% if place['trip_id'] == trip['id'] %}
                            selected
                        {% endif %}>
                        {{ trip['destination'] }}
                    </option>

                {% endfor %}

            </select>
        </div>


        <div class="mb-3">
            <label for="notes" class="form-label">
                Notes
            </label>

            <textarea
                class="form-control"
                id="notes"
                name="notes"
                rows="4"
                placeholder="Things to see, reservations, ideas...">{{ place['notes'] or '' }}</textarea>
        </div>


        <div class="form-actions">

            <button type="submit" class="button">
                💾 Save Changes
            </button>

            <a
                href="{{ url_for('saved_places') }}"
                class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
