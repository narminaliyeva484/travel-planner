{% extends "layout.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        ✏️ Edit Profile
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label for="username" class="form-label">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                value="{{ user['username'] }}"
                required>
        </div>


        <div class="mb-3">
            <label for="email" class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ user['email'] }}"
                required>
        </div>


        <div class="form-actions">

            <button type="submit" class="button">
                💾 Save Changes
            </button>

            <a
                href="{{ url_for('profile') }}"
                class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
