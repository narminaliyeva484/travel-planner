{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        🔐 Welcome Back
    </h1>

    <p class="text-center mb-4">
        Login to manage your adventures.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label for="username" class="form-label">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>

        </div>


        <div class="mb-3">

            <label for="password" class="form-label">
                Password
            </label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>


        </div>


        <button type="submit" class="button">
            Login
        </button>

        <p class="text-center mt-4">
            Don't have an account?
            <a href="{{url_for('register')}}">
                Register
            </a>
        </p>
        
    </form>

</div>

{% endblock %}
