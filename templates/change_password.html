{% extends "layout.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        🔐 Change Password
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label for="current_password" class="form-label">
                Current Password
            </label>

            <input
                type="password"
                class="form-control"
                id="current_password"
                name="current_password"
                placeholder="Enter your current password"
                required>
        </div>


        <div class="mb-3">
            <label for="new_password" class="form-label">
                New Password
            </label>

            <input
                type="password"
                class="form-control"
                id="new_password"
                name="new_password"
                placeholder="Create a new password"
                required>
        </div>


        <div class="mb-3">
            <label for="confirm_password" class="form-label">
                Confirm New Password
            </label>

            <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your new password"
                required>
        </div>


        <div class="form-actions">

            <button type="submit" class="button">
                💾 Save New Password
            </button>

            <a
                href="{{ url_for('profile') }}"
                class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
