{% extends "layout.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="container py-5">

<h1 class="text-center mb-4">
    🔐 Change Password
</h1>

<form method="POST" class="mx-auto" style="max-width: 600px;">

    <div class="mb-3">
        <label for="current_password" class="form-label">
            Current Password
        </label>

        <input
            type="password"
            class="form-control"
            id="current_password"
            name="current_password"
            required>
    </div>

    <div class="mb-3">
        <label for="new_password" class="form-label">
            New Password
        </label>

        <input
            type="password"
            class="form-control"
            id="new_password"
            name="new_password"
            required>
    </div>

    <div class="mb-3">
        <label for="confirm_password" class="form-label">
            Confirm New Password
        </label>

        <input
            type="password"
            class="form-control"
            id="confirm_password"
            name="confirm_password"
            required>
    </div>

    <button type="submit" class="btn btn-primary">
        Save New Password
    </button>

    <a href="{{ url_for('profile') }}" class="btn btn-secondary">
        Cancel
    </a>

</form>


</div>

{% endblock %}
