{% extends "layout.html" %}

{% block title %}
    My Trips
{% endblock %}

{% block content %}

<h1 class="text-center mb-4">
    ✈️ My Adventures
</h1>

<a href="{{ url_for('add_trip') }}" class="btn btn-primary mb-4">
    ➕ Plan New Trip
</a>


{% for trip in trips %}

<div class="card mb-4 shadow-sm" style="width: 18rem;">

    <div class="card-body">

        <h5 class="card-title">
            🌍 {{ trip["destination"] }}
        </h5>

        <p class="card-text">
            📅 {{ trip["date"] }}
        </p>

        <a href="{{ url_for('edit_trip', trip_id=trip['id']) }}"
           class="btn btn-warning btn-sm">
            ✏️ Edit
        </a>

        <form action="{{ url_for('delete_trip', trip_id=trip['id']) }}"
              method="POST"
              style="display:inline;">

            <button type="submit"
                    class="btn btn-danger btn-sm">
                🗑 Delete
            </button>

        </form>

    </div>

</div>

{% endfor %}

{% endblock %}
