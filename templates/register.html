{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        🌍 Create Your Account
    </h1>

    <form method="POST">

        <div class="mb-3">
            <label for="username" class="form-label">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="Choose a username"
                required>
        </div>

        <div class="mb-3">

            <label for="email" class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="mb-3">
            <label for="password" class="form-label">
                Password
            </label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Create a password"
                required>
        </div>

        <button type="submit" class="button">
            Create Account
        </button>

        <p class="text-center mt-4">
            Already have an account?
            <a href="{{url_for('login')}}">
                Login
            </a>
        </p>

    </form>

</div>

{% endblock %}
