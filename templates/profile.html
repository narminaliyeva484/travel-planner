{% extends "layout.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container py-5">


<h1 class="text-center mb-4">
    👤 My Profile
</h1>

<div class="card shadow-sm mx-auto" style="max-width: 600px;">

    <div class="card-body text-center">

        <h3 class="card-title mb-4">
            {{ session["username"] }}
        </h3>

        <p class="card-text">
            Welcome to your Travel Planner profile!
        </p>

        <div class="d-grid gap-2 mt-4">

            <a href="{{ url_for('edit_profile')}}" class="btn btn-primary">
                ✏️ Edit Profile
            </a>

            <a href="{{ url_for('change_password')}}" class="btn btn-warning">
                🔐 Change Password
            </a>

            <a href="{{ url_for('logout') }}" class="btn btn-secondary">
                🚪 Log Out
            </a>

        </div>

        <hr class="my-4">

        <h5 class="text-danger">
            Danger Zone
        </h5>

        <form action="{{ url_for('delete_account') }}" method="POST">

            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Are you sure you want to delete your account? This will permanently delete your account and all your trips.')">
                🗑 Delete Account
            </button>

        </form>

    </div>

</div>


</div>

{% endblock %}
